name: Release

# npm trusted publishing (OIDC) — no NPM_TOKEN in repo secrets.
# See RELEASING.md for the one-time npmjs.com setup and the cutover checklist.
# Trusted publisher is registered on npmjs.com (YONAN1269/dsh-sidebar-suite,
# release.yml, npm publish allowed). Pushing a v* tag triggers an OIDC publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required by softprops/action-gh-release to create the Release
  id-token: write # mints the short-lived OIDC token npm exchanges for a publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10, so pin it
      # explicitly; do NOT rely on the setup-node default.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Verify toolchain
        run: node --version && npm --version

      # Same gate as ci.yml: no publish if the offline regression is red.
      - name: Run offline regression
        run: npm test

      - name: Syntax + tarball sanity
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/temp-session-host.mjs
          npm pack --dry-run

      # A mistyped tag (v0.7.3 with package.json still 0.7.2) would publish the
      # wrong version and create a mismatched Release. Fail fast before publish.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v${PKG_VERSION}" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # Produce the real tgz so the Release step below has an asset to attach.
      # (npm pack --dry-run above only checks the file list; it writes nothing.)
      - name: Pack release tarball
        run: npm pack --silent

      # No NODE_AUTH_TOKEN / NPM_TOKEN on purpose. With id-token: write set and
      # no token in env, npm falls through to the OIDC trusted-publisher exchange.
      - name: Publish to npm with provenance
        run: npm publish --access public

      - name: Create GitHub Release from the tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-sidebar-suite-*.tgz
