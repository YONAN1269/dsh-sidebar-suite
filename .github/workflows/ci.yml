name: CI

# Offline regression: no DSH host, no network, no credentials needed.
# The suites build a miniature DOM and a stubbed Host context in Node's vm,
# then drive the real lib/client.js and lib/temp-session-host.mjs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Syntax + offline regression (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check the three runtime scripts
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/temp-session-host.mjs

      - name: Parse every JSON manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['package.json','locale/zh.json','locale/en.json','screenshots.json']) { JSON.parse(fs.readFileSync(f,'utf8')); console.log('JSON OK', f) }"

      - name: Run the five offline regression suites
        run: npm test

      - name: Verify the published tarball contains the docs and assets
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e "import fs from 'node:fs'; const j=JSON.parse(fs.readFileSync('pack.json','utf8'))[0]; const names=j.files.map(f=>f.path); for (const f of ['使用说明.md','CHANGELOG.md','DETAIL.md','screenshots.json','assets/icon-180.png','assets/screenshots/screenshot-1.png']) { if (!names.includes(f)) { console.error('MISSING from tarball:', f); process.exit(1) } console.log('packed:', f) } console.log('version', j.version, 'files', names.length)"
